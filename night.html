<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>夜間主持 - 阿瓦隆語音助理</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1c1c1c;
      --primary: #e50914;
      --text: #ffffff;
      --subtext: #777777;
      --accent: #f5a623;
      --active-bg: #2d2415;
      --active-border: #f5a623;
      --success: #2e7d32;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }
    .level-tag {
      font-size: 0.85rem;
      background: #2a2a2a;
      padding: 4px 10px;
      border-radius: 6px;
      color: var(--accent);
    }
    .script-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 75px;
    }
    .script-card {
      background: var(--card-bg);
      border: 2px solid #282828;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.45;
      transition: all 0.3s ease;
    }
    .script-num {
      font-size: 0.85rem;
      color: var(--subtext);
      font-weight: bold;
      width: 22px;
      text-align: center;
    }
    .script-text {
      font-size: 1.05rem;
      line-height: 1.45;
      color: #ccc;
      flex: 1;
    }
    .script-card.active {
      opacity: 1;
      background: var(--active-bg);
      border-color: var(--active-border);
      box-shadow: 0 0 16px rgba(245, 166, 35, 0.3);
      transform: scale(1.02);
    }
    .script-card.active .script-text {
      color: #ffffff;
      font-weight: bold;
    }
    .script-card.active .script-num {
      color: var(--accent);
    }
    .script-card.done {
      opacity: 0.3;
      border-color: #222222;
    }
    .script-card.done .script-num::before {
      content: "✓ ";
      color: #4caf50;
    }
    .controls {
      display: flex;
      gap: 10px;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(13, 13, 13, 0.95);
      padding: 12px 16px;
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }
    .btn {
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-start { background: var(--primary); color: #fff; }
    .btn-skip { background: #333333; color: #ffcc00; border: 1px solid #555; }
    .btn-next { background: var(--success); color: #fff; }
    .btn-back { background: #222222; color: #888; max-width: 90px; }
  </style>
</head>
<body>

<div class="container">

  <div class="header-bar">
    <h2 style="margin:0; font-size:1.3rem;">夜間語音流程</h2>
    <span id="level-indicator" class="level-tag">載入中...</span>
  </div>

  <div id="script-list" class="script-list"></div>

  <div class="controls">
    <button id="btn-action" class="btn btn-start">點擊開始主持</button>
    <a href="play.html" id="btn-back" class="btn btn-back">重設</a>
  </div>

</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const currentLevel = parseInt(urlParams.get('level')) || 1;
  const players = parseInt(urlParams.get('players')) || 5;
  const useLady = parseInt(urlParams.get('lady')) || 0;

  const presetDefinitions = {
    1: { name: "Lv.1 無特殊牌", merlin: false, percival: false, morgana: false, mordred: false, oberon: false },
    2: { name: "Lv.2 經典雙雄", merlin: true,  percival: false, morgana: false, mordred: false, oberon: false },
    3: { name: "Lv.3 標準進階", merlin: true,  percival: true,  morgana: true,  mordred: false, oberon: false },
    4: { name: "Lv.4 隱匿之影", merlin: true,  percival: true,  morgana: true,  mordred: true,  oberon: false },
    5: { name: "Lv.5 孤魂狂亂", merlin: true,  percival: true,  morgana: true,  mordred: false, oberon: true  },
    6: { name: "Lv.6 全角色神魔之戰", merlin: true,  percival: true,  morgana: true,  mordred: true,  oberon: true  }
  };

  const config = presetDefinitions[currentLevel] || presetDefinitions[1];
  const ladyText = useLady ? " · 🌊含女神" : "";
  document.getElementById('level-indicator').textContent = `${players}人 · ${config.name}${ladyText}`;

  function generateScripts() {
    const list = [];
    list.push({ text: "天黑請閉眼。請所有玩家雙手握拳，置於桌面上。", wait: 3500 });

    let evilText = config.oberon ? "除了奧伯倫以外的邪惡陣營玩家" : "邪惡陣營玩家";
    // 移除「請睜開眼睛」前的逗號，保持連貫不頓挫
    list.push({ text: `${evilText}請睜開眼睛，互相確認同伴。`, wait: 5000 });
    list.push({ text: "邪惡陣營玩家，請閉上眼睛。", wait: 3000 });

    if (config.merlin) {
      let evilThumb = config.mordred ? "除了莫德雷德以外的邪惡陣營玩家" : "邪惡陣營玩家";
      list.push({ text: `${evilThumb}，請豎起大拇指，讓梅林辨認。`, wait: 2500 });
      list.push({ text: "梅林，請睜開眼睛。", wait: 4000 });
      // 改為「請收起大拇指」
      list.push({ text: `梅林請閉上眼睛，${evilThumb}請收起大拇指。`, wait: 3000 });
    }

    if (config.percival) {
      let thumbGroup = config.morgana ? "梅林與莫甘娜" : "梅林";
      list.push({ text: `${thumbGroup}，請豎起大拇指。`, wait: 2500 });
      list.push({ text: "派西維爾，請睜開眼睛。", wait: 4000 });
      // 改為「請收起大拇指」
      list.push({ text: `派西維爾請閉上眼睛，${thumbGroup}請收起大拇指。`, wait: 3000 });
    }

    list.push({ text: "天亮了，所有人請睜開眼睛！請第一位隊長開始組織任務隊伍。", wait: 1500 });
    return list;
  }

  const scripts = generateScripts();
  const container = document.getElementById('script-list');
  scripts.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'script-card';
    card.id = `card-${index}`;
    card.innerHTML = `
      <div class="script-num">${index + 1}</div>
      <div class="script-text">${item.text}</div>
    `;
    container.appendChild(card);
  });

  let isRunning = false;
  let isCancelled = false;
  let isDone = false;

  function speak(text) {
    return new Promise((resolve) => {
      if (isCancelled) return resolve();

      // 將「邪惡」的發音替換為「鞋二」
      const spokenText = text.replaceAll('邪惡', '鞋二');

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.88;
      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();
      window.speechSynthesis.speak(utterance);
    });
  }

  function wait(ms) {
    return new Promise((resolve) => {
      const step = 100;
      let elapsed = 0;
      const interval = setInterval(() => {
        if (isCancelled || elapsed >= ms) {
          clearInterval(interval);
          resolve();
        }
        elapsed += step;
      }, step);
    });
  }

  async function runNightProcess() {
    isRunning = true;
    isCancelled = false;
    isDone = false;
    const actionBtn = document.getElementById('btn-action');
    actionBtn.textContent = "跳過夜間 ⏩";
    actionBtn.className = "btn btn-skip";

    for (let i = 0; i < scripts.length; i++) {
      if (isCancelled) break;

      document.querySelectorAll('.script-card').forEach((c, idx) => {
        if (idx < i) {
          c.className = 'script-card done';
        } else if (idx === i) {
          c.className = 'script-card active';
          c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          c.className = 'script-card';
        }
      });

      await speak(scripts[i].text);
      await wait(scripts[i].wait);
    }

    if (!isCancelled) {
      finishNightUI();
    }
  }

  function skipNightProcess() {
    isCancelled = true;
    isRunning = false;
    window.speechSynthesis.cancel();
    finishNightUI();
  }

  function finishNightUI() {
    document.querySelectorAll('.script-card').forEach(c => c.className = 'script-card done');
    isRunning = false;
    isDone = true;
    const actionBtn = document.getElementById('btn-action');
    actionBtn.textContent = "進入白天出任務 ➜";
    actionBtn.className = "btn btn-next";
  }

  document.getElementById('btn-action').addEventListener('click', () => {
    if (isDone) {
      window.location.href = `game.html?players=${players}&level=${currentLevel}&lady=${useLady}`;
    } else if (isRunning) {
      skipNightProcess();
    } else {
      runNightProcess();
    }
  });

  window.addEventListener('beforeunload', () => {
    window.speechSynthesis.cancel();
  });
</script>

</body>
</html>
