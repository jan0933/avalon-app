<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>夜間主持 - 阿瓦隆語音助理</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1c1c1c;
      --primary: #e50914;
      --text: #ffffff;
      --subtext: #777777;
      --accent: #f5a623;
      --active-bg: #2d2415;
      --active-border: #f5a623;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }
    .level-tag {
      font-size: 0.85rem;
      background: #2a2a2a;
      padding: 4px 10px;
      border-radius: 6px;
      color: var(--accent);
    }
    /* 每一句台詞的框框卡片 */
    .script-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .script-card {
      background: var(--card-bg);
      border: 2px solid #282828;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.45;
      transition: all 0.3s ease;
    }
    .script-num {
      font-size: 0.85rem;
      color: var(--subtext);
      font-weight: bold;
      width: 22px;
      text-align: center;
    }
    .script-text {
      font-size: 1.05rem;
      line-height: 1.45;
      color: #ccc;
      flex: 1;
    }
    /* 念到當前句子的變色樣式（發光金黃色） */
    .script-card.active {
      opacity: 1;
      background: var(--active-bg);
      border-color: var(--active-border);
      box-shadow: 0 0 16px rgba(245, 166, 35, 0.3);
      transform: scale(1.02);
    }
    .script-card.active .script-text {
      color: #ffffff;
      font-weight: bold;
    }
    .script-card.active .script-num {
      color: var(--accent);
    }
    /* 已念過的句子（淡淡打勾） */
    .script-card.done {
      opacity: 0.3;
      border-color: #222222;
    }
    .script-card.done .script-num::before {
      content: "✓ ";
      color: #4caf50;
    }
    .controls {
      display: flex;
      gap: 10px;
      position: sticky;
      bottom: 16px;
      background: rgba(13, 13, 13, 0.9);
      padding: 10px 0;
      backdrop-filter: blur(10px);
    }
    .btn {
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      flex: 1;
    }
    .btn-start {
      background: var(--primary);
      color: #fff;
    }
    .btn-stop {
      background: #2a2a2a;
      color: #bbb;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header-bar">
    <h2 style="margin:0; font-size:1.3rem;">夜間語音流程</h2>
    <span id="level-indicator" class="level-tag">載入中...</span>
  </div>

  <!-- 台詞卡片容器 -->
  <div id="script-list" class="script-list"></div>

  <!-- 底部按鈕控制列 -->
  <div class="controls">
    <button id="btn-action" class="btn btn-start">點擊開始主持</button>
    <a href="play.html" id="btn-back" class="btn btn-stop">返回重設</a>
  </div>

</div>

<script>
  // 1. 解析網址參數 (?level=X)
  const urlParams = new URLSearchParams(window.location.search);
  const currentLevel = parseInt(urlParams.get('level')) || 1;

  // 角色等級定義
  const presetDefinitions = {
    1: { name: "Lv.1 無特殊牌", merlin: false, percival: false, morgana: false, mordred: false, oberon: false },
    2: { name: "Lv.2 經典雙雄", merlin: true,  percival: false, morgana: false, mordred: false, oberon: false },
    3: { name: "Lv.3 標準進階", merlin: true,  percival: true,  morgana: true,  mordred: false, oberon: false },
    4: { name: "Lv.4 隱匿之影", merlin: true,  percival: true,  morgana: true,  mordred: true,  oberon: false },
    5: { name: "Lv.5 孤魂狂亂", merlin: true,  percival: true,  morgana: true,  mordred: false, oberon: true  },
    6: { name: "Lv.6 全角色神魔之戰", merlin: true,  percival: true,  morgana: true,  mordred: true,  oberon: true  }
  };

  const config = presetDefinitions[currentLevel] || presetDefinitions[1];
  document.getElementById('level-indicator').textContent = config.name;

  // 2. 根據等級生成台詞清單
  function generateScripts() {
    const list = [];

    // ① 開場閉眼
    list.push({ text: "天黑請閉眼。請所有玩家雙手握拳，置於桌面上。", wait: 3500 });

    // ② 邪惡陣營互認
    let evilText = config.oberon ? "除了奧伯倫以外的邪惡陣營玩家" : "邪惡陣營玩家";
    list.push({ text: `${evilText}，請睜開眼睛，互相確認同伴。`, wait: 5000 });
    list.push({ text: "邪惡陣營玩家，請閉上眼睛。", wait: 3000 });

    // ③ 梅林辨認壞人
    if (config.merlin) {
      let evilThumb = config.mordred ? "除了莫德雷德以外的邪惡陣營玩家" : "邪惡陣營玩家";
      list.push({ text: `${evilThumb}，請豎起大拇指，讓梅林辨認。`, wait: 2500 });
      list.push({ text: "梅林，請睜開眼睛。", wait: 4000 });
      list.push({ text: `梅林請閉上眼睛，${evilThumb}請放下大拇指。`, wait: 3000 });
    }

    // ④ 派西維爾辨認梅林與莫甘娜
    if (config.percival) {
      let thumbGroup = config.morgana ? "梅林與莫甘娜" : "梅林";
      list.push({ text: `${thumbGroup}，請豎起大拇指。`, wait: 2500 });
      list.push({ text: "派西維爾，請睜開眼睛。", wait: 4000 });
      list.push({ text: `派西維爾請閉上眼睛，${thumbGroup}請放下大拇指。`, wait: 3000 });
    }

    // ⑤ 天亮
    list.push({ text: "天亮了，所有人請睜開眼睛！", wait: 1000 });

    return list;
  }

  const scripts = generateScripts();

  // 3. 渲染到畫面上生成卡片
  const container = document.getElementById('script-list');
  scripts.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'script-card';
    card.id = `card-${index}`;
    card.innerHTML = `
      <div class="script-num">${index + 1}</div>
      <div class="script-text">${item.text}</div>
    `;
    container.appendChild(card);
  });

  // 4. 語音朗讀與流程控制
  let isRunning = false;
  let isCancelled = false;

  function speak(text) {
    return new Promise((resolve) => {
      if (isCancelled) return resolve();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.88;
      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();
      window.speechSynthesis.speak(utterance);
    });
  }

  function wait(ms) {
    return new Promise((resolve) => {
      const step = 100;
      let elapsed = 0;
      const interval = setInterval(() => {
        if (isCancelled || elapsed >= ms) {
          clearInterval(interval);
          resolve();
        }
        elapsed += step;
      }, step);
    });
  }

  async function runNightProcess() {
    isRunning = true;
    isCancelled = false;
    const actionBtn = document.getElementById('btn-action');
    actionBtn.textContent = "中止主持";
    actionBtn.className = "btn btn-stop";

    for (let i = 0; i < scripts.length; i++) {
      if (isCancelled) break;

      // 當前卡片變色高亮
      document.querySelectorAll('.script-card').forEach((c, idx) => {
        if (idx < i) {
          c.className = 'script-card done';
        } else if (idx === i) {
          c.className = 'script-card active';
          // 自動滾動平移至當前卡片視角
          c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          c.className = 'script-card';
        }
      });

      // 念出當前句子並等待停頓
      await speak(scripts[i].text);
      await wait(scripts[i].wait);
    }

    if (!isCancelled) {
      // 全數朗讀完成
      document.querySelectorAll('.script-card').forEach(c => c.className = 'script-card done');
      actionBtn.textContent = "主持完畢（再次點擊重新開始）";
      actionBtn.className = "btn btn-start";
      isRunning = false;
    }
  }

  function stopProcess() {
    isCancelled = true;
    isRunning = false;
    window.speechSynthesis.cancel();
    document.querySelectorAll('.script-card').forEach(c => c.className = 'script-card');
    const actionBtn = document.getElementById('btn-action');
    actionBtn.textContent = "重新開始主持";
    actionBtn.className = "btn btn-start";
  }

  // 綁定主持按鈕
  document.getElementById('btn-action').addEventListener('click', () => {
    if (isRunning) {
      stopProcess();
    } else {
      runNightProcess();
    }
  });

  // 離開頁面時立即中止語音
  window.addEventListener('beforeunload', () => {
    window.speechSynthesis.cancel();
  });
</script>

</body>
</html>
