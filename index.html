<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>阿瓦隆語音助理</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #e50914;
      --text: #ffffff;
      --subtext: #aaaaaa;
      --accent: #f5a623;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    h1 { font-size: 2rem; color: var(--accent); margin-bottom: 5px; }
    p { color: var(--subtext); margin-top: 0; }
    .btn {
      display: block;
      background: var(--card-bg);
      color: var(--text);
      text-decoration: none;
      border: 1px solid #333;
      padding: 18px;
      font-size: 1.2rem;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); border: none; }
    .btn-secondary { background: #2a2a2a; border: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚔️ 阿瓦隆語音助理</h1>
  <p>個人隨身主持小工具</p>
  <div style="height: 40px;"></div>
  <a href="play.html" class="btn btn-primary">開始遊戲</a>
  <a href="rules.html" class="btn btn-secondary">規則說明</a>
</div>

</body>
</html>
