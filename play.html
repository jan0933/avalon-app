<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>遊戲配置 - 阿瓦隆語音助理</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #e50914;
      --text: #ffffff;
      --subtext: #aaaaaa;
      --accent: #f5a623;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 { text-align: center; margin: 10px 0; font-size: 1.4rem; }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid #333;
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      width: 100%;
    }
    .btn-primary { background: var(--primary); border: none; }
    .btn-secondary { background: #2a2a2a; border: none; }
    .player-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .player-btn {
      padding: 12px;
      background: #2a2a2a;
      border: 2px solid transparent;
      color: var(--text);
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .player-btn.selected {
      border-color: var(--accent);
      background: #382d1d;
      font-weight: bold;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preset-item {
      background: #262626;
      border: 2px solid #383838;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s;
    }
    .preset-item.selected {
      border-color: var(--accent);
      background: #382d1d;
    }
    .preset-item.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #2a2a2a;
      background: #1c1c1c;
    }
    .preset-radio {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }
    .preset-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }
    .preset-title {
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preset-desc {
      font-size: 0.82rem;
      color: var(--subtext);
      line-height: 1.4;
    }
    .preset-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #444;
      color: #fff;
    }
    .preset-item.selected .preset-badge {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>配置遊戲</h2>

  <div class="card">
    <div><b>選擇人數：</b> <span id="player-summary" style="color:var(--accent);">5 人（3 好 2 壞）</span></div>
    <div class="player-select">
      <button class="player-btn selected" data-num="5">5 人</button>
      <button class="player-btn" data-num="6">6 人</button>
      <button class="player-btn" data-num="7">7 人</button>
      <button class="player-btn" data-num="8">8 人</button>
      <button class="player-btn" data-num="9">9 人</button>
      <button class="player-btn" data-num="10">10 人</button>
    </div>
    <div id="quest-roster" style="font-size:0.85rem; color:#bbb; background:#121212; padding:8px 12px; border-radius:6px; margin-top:4px;">
      任務指派人數：[2, 3, 2, 3, 3]
    </div>
  </div>

  <div class="card">
    <b>選擇配置等級：</b>
    <div class="preset-list">

      <label class="preset-item selected" data-level="1">
        <input type="radio" name="role-preset" value="1" class="preset-radio" checked>
        <div class="preset-content">
          <div class="preset-title">Lv.1 無特殊牌 <span class="preset-badge">新手局</span></div>
          <div class="preset-desc">全體為忠臣與爪牙，夜間僅壞人互認。</div>
        </div>
      </label>

      <label class="preset-item" data-level="2">
        <input type="radio" name="role-preset" value="2" class="preset-radio">
        <div class="preset-content">
          <div class="preset-title">Lv.2 經典雙雄 <span class="preset-badge">基礎對決</span></div>
          <div class="preset-desc">梅林、刺客</div>
        </div>
      </label>

      <label class="preset-item" data-level="3">
        <input type="radio" name="role-preset" value="3" class="preset-radio">
        <div class="preset-content">
          <div class="preset-title">Lv.3 標準進階 <span class="preset-badge">熱門推薦</span></div>
          <div class="preset-desc">梅林、派西維爾、刺客、莫甘娜</div>
        </div>
      </label>

      <label class="preset-item" data-level="4">
        <input type="radio" name="role-preset" value="4" class="preset-radio">
        <div class="preset-content">
          <div class="preset-title">Lv.4 隱匿之影 <span class="preset-badge">7人以上</span></div>
          <div class="preset-desc">梅林、派西維爾、刺客、莫甘娜、莫德雷德</div>
        </div>
      </label>

      <label class="preset-item" data-level="5">
        <input type="radio" name="role-preset" value="5" class="preset-radio">
        <div class="preset-content">
          <div class="preset-title">Lv.5 孤魂狂亂 <span class="preset-badge">7人以上</span></div>
          <div class="preset-desc">梅林、派西維爾、刺客、莫甘娜、奧伯倫</div>
        </div>
      </label>

      <label class="preset-item" data-level="6">
        <input type="radio" name="role-preset" value="6" class="preset-radio">
        <div class="preset-content">
          <div class="preset-title">Lv.6 全角色神魔之戰 <span class="preset-badge">10人限定</span></div>
          <div class="preset-desc">梅林、派西維爾、刺客、莫甘娜、莫德雷德、奧伯倫</div>
        </div>
      </label>

    </div>
  </div>

  <button id="btn-go-night" class="btn btn-primary">進入夜間主持</button>
  <a href="index.html" class="btn btn-secondary">返回首頁</a>
</div>

<script>
  const playerConfigs = {
    5: { desc: "3 好 2 壞", evilMax: 2, quests: "任務指派人數：[2, 3, 2, 3, 3]" },
    6: { desc: "4 好 2 壞", evilMax: 2, quests: "任務指派人數：[2, 3, 4, 3, 4]" },
    7: { desc: "4 好 3 壞", evilMax: 3, quests: "任務指派人數：[2, 3, 3, 4*, 4] (*需2張失敗牌)" },
    8: { desc: "5 好 3 壞", evilMax: 3, quests: "任務指派人數：[3, 4, 4, 5*, 5] (*需2張失敗牌)" },
    9: { desc: "6 好 3 壞", evilMax: 3, quests: "任務指派人數：[3, 4, 4, 5*, 5] (*需2張失敗牌)" },
    10: { desc: "6 好 4 壞", evilMax: 4, quests: "任務指派人數：[3, 4, 4, 5*, 5] (*需2張失敗牌)" }
  };

  const presetEvilLimits = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 3, 6: 4 };

  let currentPlayerCount = 5;
  let currentLevel = 1;

  function setPlayers(num) {
    currentPlayerCount = num;
    document.querySelectorAll('.player-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.getAttribute('data-num') == num);
    });
    document.getElementById('player-summary').textContent = `${num} 人（${playerConfigs[num].desc}）`;
    document.getElementById('quest-roster').textContent = playerConfigs[num].quests;

    updatePresetAvailability();
  }

  function updatePresetAvailability() {
    const evilLimit = playerConfigs[currentPlayerCount].evilMax;

    document.querySelectorAll('.preset-item').forEach(item => {
      const level = parseInt(item.getAttribute('data-level'));
      const requiredEvil = presetEvilLimits[level];
      const radio = item.querySelector('input[type="radio"]');

      if (requiredEvil > evilLimit) {
        item.classList.add('disabled');
        radio.disabled = true;
        if (currentLevel === level) {
          selectLevel(evilLimit >= 2 ? 3 : 1);
        }
      } else {
        item.classList.remove('disabled');
        radio.disabled = false;
      }
    });
  }

  function selectLevel(level) {
    const evilLimit = playerConfigs[currentPlayerCount].evilMax;
    if (presetEvilLimits[level] > evilLimit) return;

    currentLevel = level;
    document.querySelectorAll('.preset-item').forEach(item => {
      const lvl = parseInt(item.getAttribute('data-level'));
      const isCurrent = (lvl === level);
      item.classList.toggle('selected', isCurrent);
      item.querySelector('input[type="radio"]').checked = isCurrent;
    });
  }

  document.querySelectorAll('.preset-item').forEach(item => {
    item.addEventListener('click', () => {
      const level = parseInt(item.getAttribute('data-level'));
      selectLevel(level);
    });
  });

  document.querySelectorAll('.player-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = parseInt(btn.getAttribute('data-num'));
      setPlayers(num);
    });
  });

  // 點擊帶參數跳轉到獨立主持頁
  document.getElementById('btn-go-night').addEventListener('click', () => {
    window.location.href = `night.html?level=${currentLevel}`;
  });

  setPlayers(5);
</script>

</body>
</html>
