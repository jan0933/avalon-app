<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>任務戰情室 - 阿瓦隆語音助理</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #e50914;
      --text: #ffffff;
      --subtext: #888888;
      --accent: #f5a623;
      --good-blue: #1976d2;
      --evil-red: #d32f2f;
      --lake-blue: #0288d1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 { text-align: center; margin: 4px 0 10px; font-size: 1.4rem; color: var(--accent); }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* 5個任務圓圈進度條 */
    .quest-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .quest-node {
      background: #2a2a2a;
      border: 2px solid #3d3d3d;
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .quest-node.active-quest {
      border-color: var(--accent);
      background: #332715;
      box-shadow: 0 0 10px rgba(245, 166, 35, 0.25);
    }
    .quest-node.success { background: var(--good-blue); border-color: #64b5f6; }
    .quest-node.fail { background: var(--evil-red); border-color: #ef9a9a; }
    .quest-title { font-size: 0.75rem; color: var(--subtext); }
    .quest-count { font-size: 1.25rem; font-weight: bold; }
    .quest-sub { font-size: 0.65rem; color: #ffab91; }

    /* 任務板內建成功/失敗按鈕 */
    .quest-resolve-btns {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-resolve {
      flex: 1;
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .btn-resolve:active { transform: scale(0.97); }
    .btn-resolve-good { background: var(--good-blue); }
    .btn-resolve-evil { background: var(--evil-red); }

    /* 湖中女神區域 */
    .lake-card { border-left: 4px solid var(--lake-blue); }
    .lady-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
    }
    .lady-input {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      width: 75px;
      text-align: center;
    }

    /* 連續否決計數器 */
    .reject-tracker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .reject-dot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .reject-dot.active {
      background: var(--primary);
      border-color: #ff7961;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }

    /* 由上而下單欄排列的一鍵廣播按鈕 */
    .broadcast-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .btn-broadcast {
      background: #262626;
      border: 1px solid #3d3d3d;
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.98rem;
      cursor: pointer;
      font-weight: 500;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }
    .btn-broadcast:active { background: #333333; }
    .broadcast-arrow { color: var(--accent); font-size: 0.85rem; }

    .btn-bar { display: flex; gap: 10px; margin-top: 8px; }
    .btn {
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      flex: 1;
    }
    .btn-gray { background: #333; color: #fff; }
    .btn-reset { background: #222; color: #888; }
  </style>
</head>
<body>

<div class="container">
  <h2>🛡️ 白天任務進行中</h2>

  <!-- 1. 任務出征板（含任務節點與勝負結算按鍵） -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b>🗺️ 任務出征板 (<span id="player-num-tag">5</span> 人局)</b>
      <span style="font-size:0.75rem; color:var(--subtext);">點擊節點可手動修正</span>
    </div>

    <!-- 5個任務圓圈進度 -->
    <div class="quest-grid" id="quest-grid"></div>

    <div id="quest-detail-tip" style="font-size:0.9rem; color:var(--accent); text-align:center; min-height:1.3em;">
      當前進行：第 1 任務，需派 2 人出征
    </div>

    <!-- 整併至任務出征板的勝負按鈕 -->
    <div class="quest-resolve-btns">
      <button class="btn-resolve btn-resolve-good" onclick="resolveCurrentQuest('success')">
        🏆 當前任務成功 (好人勝)
      </button>
      <button class="btn-resolve btn-resolve-evil" onclick="resolveCurrentQuest('fail')">
        💀 當前任務失敗 (壞人勝)
      </button>
    </div>
  </div>

  <!-- 2. 湖中女神紀錄板（若開局有勾選才顯示） -->
  <div class="card lake-card" id="lady-container" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b style="color:var(--lake-blue);">🌊 湖中女神驗人紀錄</b>
      <button style="background:#2a2a2a; border:1px solid #444; color:#fff; padding:5px 9px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="speakLadyVoice()">語音宣告驗人</button>
    </div>
    <div style="font-size:0.8rem; color:var(--subtext); line-height:1.4;">
      起始持有人：第 1 任隊長右側玩家。<br>
      被查驗者僅私下出示陣營，並成為下一任女神持有者。
    </div>
    
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div class="lady-step">
        <span style="width:75px;">R2 結束：</span>
        <input type="text" placeholder="持卡者" class="lady-input"> 查驗 
        <input type="text" placeholder="被查驗" class="lady-input">
      </div>
      <div class="lady-step">
        <span style="width:75px;">R3 結束：</span>
        <input type="text" placeholder="持卡者" class="lady-input"> 查驗 
        <input type="text" placeholder="被查驗" class="lady-input">
      </div>
      <div class="lady-step">
        <span style="width:75px;">R4 結束：</span>
        <input type="text" placeholder="持卡者" class="lady-input"> 查驗 
        <input type="text" placeholder="被查驗" class="lady-input">
      </div>
    </div>
  </div>

  <!-- 3. 連續否決計數器 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b>⚠️ 隊長組隊否決計數器</b>
      <span style="font-size:0.8rem; color:#ff5252;">連續 5 次否決壞人勝</span>
    </div>
    <div class="reject-tracker">
      <div class="reject-dot" data-val="1">1</div>
      <div class="reject-dot" data-val="2">2</div>
      <div class="reject-dot" data-val="3">3</div>
      <div class="reject-dot" data-val="4">4</div>
      <div class="reject-dot" data-val="5" style="border-color:#ff5252; color:#ff5252;">5</div>
    </div>
    <div style="display:flex; gap:10px; margin-top:4px;">
      <button style="flex:1; background:#2a2a2a; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:0.85rem; cursor:pointer;" onclick="addReject()">投票被否決 (+1)</button>
      <button style="flex:1; background:#2a2a2a; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:0.85rem; cursor:pointer;" onclick="resetReject()">組隊通過 (歸零)</button>
    </div>
  </div>

  <!-- 4. 主持人一鍵廣播（由上而下按流程順序排列） -->
  <div class="card">
    <b>📢 主持人一鍵廣播</b>
    <div class="broadcast-list">
      <button class="btn-broadcast" onclick="speakText('請當前隊長開始發言，並提名出征隊員！')">
        <span>1. 🗣️ 請隊長組織提名隊伍</span>
        <span class="broadcast-arrow">廣播 ➜</span>
      </button>

      <button class="btn-broadcast" onclick="speakText('全體玩家請準備，3、2、1，請投票！')">
        <span>2. 🗳️ 全體投票倒數 3、2、1</span>
        <span class="broadcast-arrow">廣播 ➜</span>
      </button>

      <button class="btn-broadcast" onclick="speakText('組隊通過！任務隊員請閉上雙眼，私下提交任務卡！')">
        <span>3. 🤫 隊員閉眼提交任務卡</span>
        <span class="broadcast-arrow">廣播 ➜</span>
      </button>

      <button class="btn-broadcast" onclick="speakText('好人陣營已獲得三場勝利！請刺客現身，進行刺殺梅林環節！')">
        <span>4. 🗡️ 進入刺客刺殺梅林環節</span>
        <span class="broadcast-arrow">廣播 ➜</span>
      </button>
    </div>
  </div>

  <div class="btn-bar">
    <a href="play.html" class="btn btn-reset">重開新局</a>
    <a href="rules.html" class="btn btn-gray">查看規則</a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const players = parseInt(urlParams.get('players')) || 5;
  const useLady = parseInt(urlParams.get('lady')) === 1;

  document.getElementById('player-num-tag').textContent = players;

  if (useLady) {
    document.getElementById('lady-container').style.display = 'flex';
  }

  const questConfigs = {
    5:  [2, 3, 2, 3, 3],
    6:  [2, 3, 4, 3, 4],
    7:  [2, 3, 3, 4, 4],
    8:  [3, 4, 4, 5, 5],
    9:  [3, 4, 4, 5, 5],
    10: [3, 4, 4, 5, 5]
  };

  const currentQuests = questConfigs[players] || questConfigs[5];
  // 任務狀態陣列：null (未完成), 'success', 'fail'
  const questStatus = [null, null, null, null, null];

  // 渲染 5 個任務進度節點
  const grid = document.getElementById('quest-grid');
  currentQuests.forEach((count, i) => {
    const isDoubleFail = (players >= 7 && i === 3);
    const node = document.createElement('div');
    node.className = `quest-node ${i === 0 ? 'active-quest' : ''}`;
    node.id = `q-${i}`;
    node.innerHTML = `
      <div class="quest-title">R${i + 1}</div>
      <div class="quest-count">${count}人</div>
      ${isDoubleFail ? '<div class="quest-sub">需2失敗</div>' : ''}
    `;
    node.addEventListener('click', () => toggleQuestManual(i));
    grid.appendChild(node);
  });

  // 尋找當前尚未結算的第一個任務索引
  function getCurrentQuestIndex() {
    return questStatus.findIndex(s => s === null);
  }

  // 點擊「成功」或「失敗」按鈕：結算當前任務並自動跳下一輪
  function resolveCurrentQuest(result) {
    const curIdx = getCurrentQuestIndex();
    if (curIdx === -1) {
      alert("所有任務皆已結算完畢！若需修改請直接點擊上方任務圓圈。");
      return;
    }

    questStatus[curIdx] = result;
    const node = document.getElementById(`q-${curIdx}`);
    node.className = `quest-node ${result}`;

    // 播報語音並重設組隊否決計數器
    resetReject();
    if (result === 'success') {
      speakText(`第 ${curIdx + 1} 次任務成功！正義陣營獲得一勝！`);
    } else {
      speakText(`第 ${curIdx + 1} 次任務失敗！邪惡陣營獲得一勝！`);
    }

    updateBoardState();
  }

  // 手動點擊節點修正狀態（容錯用）
  function toggleQuestManual(index) {
    const node = document.getElementById(`q-${index}`);
    if (questStatus[index] === null) {
      questStatus[index] = 'success';
      node.className = 'quest-node success';
    } else if (questStatus[index] === 'success') {
      questStatus[index] = 'fail';
      node.className = 'quest-node fail';
    } else {
      questStatus[index] = null;
      node.className = 'quest-node';
    }
    updateBoardState();
  }

  // 刷新介面、高亮當前回合與檢查獲勝
  function updateBoardState() {
    const winGood = questStatus.filter(s => s === 'success').length;
    const winEvil = questStatus.filter(s => s === 'fail').length;
    const tip = document.getElementById('quest-detail-tip');

    if (winGood >= 3) {
      tip.textContent = "🏆 好人已完成 3 次任務！進入刺客刺殺階段！";
      tip.style.color = "#64b5f6";
      document.querySelectorAll('.quest-node').forEach(n => n.classList.remove('active-quest'));
      return;
    } 
    
    if (winEvil >= 3) {
      tip.textContent = "💀 壞人已累積 3 次任務失敗！邪惡陣營獲勝！";
      tip.style.color = "#ef9a9a";
      document.querySelectorAll('.quest-node').forEach(n => n.classList.remove('active-quest'));
      return;
    }

    const nextIdx = getCurrentQuestIndex();
    if (nextIdx !== -1) {
      document.querySelectorAll('.quest-node').forEach((n, idx) => {
        n.classList.toggle('active-quest', idx === nextIdx);
      });
      const count = currentQuests[nextIdx];
      const double = (players >= 7
